<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign Up | NEXPLAY</title><link rel="stylesheet" href="css/style.css"></head><body><header class="nav"><a class="brand" href="index.html"><span class="brand-mark">N</span>NEXPLAY</a><a href="index.html">← Home</a></header><main class="auth-wrap"><form class="auth-card" id="signupForm"><p class="eyebrow">JOIN THE COMMUNITY</p><h1>Create player account</h1><p class="muted">Your next gaming chapter starts here.</p><label>Player name<input id="name" type="text" required minlength="2" maxlength="24" placeholder="Choose a player name"></label><label>Email address<input id="email" type="email" required autocomplete="email" placeholder="you@example.com"></label><label>Password<input id="password" type="password" required minlength="6" autocomplete="new-password" placeholder="At least 6 characters"></label><button class="btn primary full" type="submit">Create account</button><p id="message" class="message" aria-live="polite"></p><p class="muted center">Already registered? <a href="login.html">Login</a></p></form></main><script type="module" src="js/auth.js"></script></body></html>
